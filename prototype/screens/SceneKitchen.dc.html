<script type="text/x-dc" data-dc-script data-props='{"animate":{"editor":"boolean","default":true},"$preview":{"width":780,"height":1100}}'>
class Component extends DCLogic {
  applyMotion() {
    const el = this.rootEl;
    if (!el || !el.querySelectorAll) return;
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduce = false; }
    const on = (this.props.animate ?? true) && !reduce;
    el.querySelectorAll('svg').forEach((s) => {
      try { if (on) { s.unpauseAnimations(); } else { s.pauseAnimations(); } } catch (e) {}
    });
  }
  componentDidMount() { this.applyMotion(); }
  componentDidUpdate() { this.applyMotion(); }
  renderVals() {
    return {
      rootRef: (el) => { this.rootEl = el; },
      animate: this.props.animate ?? true
    };
  }
}
</script>
